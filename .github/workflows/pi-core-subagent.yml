name: Extension CI

on:
  push:
    branches: [main]
    paths:
      ["packages/**", "package.json", "pnpm-lock.yaml", ".github/workflows/pi-core-subagent.yml"]
  pull_request:
    branches: [main]
    paths:
      ["packages/**", "package.json", "pnpm-lock.yaml", ".github/workflows/pi-core-subagent.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check